name: Publish Naftiko Crafter Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to upload the VSIX to (e.g. v1.2.3). Leave empty to skip publishing.'
        required: false
      polychro_run_id:
        description: 'Polychro Actions run ID to grab the native binaries from (e.g. 27817125654). Leave empty to use a Polychro release instead.'
        required: false

jobs:
  publish-vsix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App token for crafter
        id: app-token-crafter
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_CRAFTER_CONTENTS_READ_ID }}
          private-key: ${{ secrets.APP_CRAFTER_CONTENTS_READ_PRIVATE_KEY }}
          owner: naftiko
          repositories: crafter

      - name: Generate GitHub App token for polychro (Actions read)
        id: app-token-polychro
        if: github.event.inputs.polychro_run_id != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_POLYCHRO_ACTION_READ_ID }}
          private-key: ${{ secrets.APP_POLYCHRO_ACTION_READ_PRIVATE_KEY }}
          owner: naftiko
          repositories: polychro

      - name: Checkout naftiko/crafter repository
        uses: actions/checkout@v5
        with:
          repository: naftiko/crafter
          token: ${{ steps.app-token-crafter.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: extensions/naftiko-crafter/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: extensions/naftiko-crafter

      - name: Resolve Polychro version and date
        # Resolve up front (before fetching binaries) so the version-compatibility gate
        # below can run before any binary is downloaded, and this step's output is reused
        # by "Write Polychro version and date" further down instead of being recomputed.
        #  - If polychro_run_id is set: use the run id itself as the version (no gate
        #    possible — a run id is not a released, comparable semver).
        #  - Otherwise: use the tag of the latest Polychro release.
        id: resolve-polychro-version
        env:
          GH_TOKEN: ${{ github.token }}
          POLYCHRO_RUN_ID: ${{ github.event.inputs.polychro_run_id }}
        run: |
          set -euo pipefail

          if [ -n "${POLYCHRO_RUN_ID}" ]; then
            POLYCHRO_VERSION="${POLYCHRO_RUN_ID}"
          else
            # /releases/latest ignores pre-releases; naftiko/polychro only publishes
            # pre-releases (e.g. v1.0.0-alphaN), so list releases and take the most recent one.
            POLYCHRO_VERSION=$(gh release list --repo naftiko/polychro --limit 1 --json tagName --jq '.[0].tagName')
          fi

          if [ -z "${POLYCHRO_VERSION}" ]; then
            echo "Could not resolve the Polychro version" >&2
            exit 1
          fi

          echo "Polychro version: ${POLYCHRO_VERSION}"
          echo "version=${POLYCHRO_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "date=$(date -u +%Y-%m-%d)" >> "${GITHUB_OUTPUT}"

      - name: Gate on minimum Polychro version (--schema support)
        # `PolychroValidator` (extensions/naftiko-crafter/src/validators/polychroValidator.ts)
        # relies on `--schema` for structural JSON Schema validation. That option exists in the
        # CLI's parser since v1.0.0-alpha3, but was a silent no-op until v1.0.0-alpha4
        # (naftiko/polychro#20: the packaged CLI shipped without any ValidatorFactory SPI
        # implementation on its runtime classpath, so `polychro lint` always printed "No
        # issues found." regardless of the document). Bundling anything older than
        # v1.0.0-alpha4 would silently ship a VSIX whose structural validation never runs.
        # Skipped for polychro_run_id builds — a run id is not a comparable release version,
        # and manual run-id builds are an explicit, deliberate escape hatch.
        #
        # Comparison done in Python rather than `sort -V`: sort -V has no semver semantics
        # for the "-TIERn" suffix — it would rank a future stable "v1.0.0" release as OLDER
        # than "v1.0.0-alpha4" (shorter string sorts first), which is backwards. A stable
        # release must always outrank any prerelease of the same MAJOR.MINOR.PATCH.
        if: github.event.inputs.polychro_run_id == ''
        env:
          POLYCHRO_VERSION: ${{ steps.resolve-polychro-version.outputs.version }}
          MIN_VERSION: "v1.0.0-alpha4"
        run: |
          set -euo pipefail

          python3 -c "
          import os, re, sys

          PATTERN = re.compile(r'^v?(\d+)\.(\d+)\.(\d+)(?:-([a-zA-Z]+)(\d+))?$')
          TIERS = {'alpha': 0, 'beta': 1, 'rc': 2}

          def parse(v):
              m = PATTERN.match(v)
              if not m:
                  sys.exit(f'::error::Unrecognized Polychro version format: {v!r}')
              major, minor, patch, tier, num = m.groups()
              if tier is None:
                  # No prerelease sorts as the highest tier (a stable release outranks every prerelease).
                  tier_rank = len(TIERS)
              else:
                  tier_lower = tier.lower()
                  if tier_lower not in TIERS:
                      sys.exit(f'::error::Unrecognized Polychro prerelease tier {tier!r} in version {v!r}')
                  tier_rank = TIERS[tier_lower]
              return (int(major), int(minor), int(patch), tier_rank, int(num) if num else 0)

          polychro_version = os.environ['POLYCHRO_VERSION']
          min_version = os.environ['MIN_VERSION']
          actual = parse(polychro_version)
          minimum = parse(min_version)
          if actual < minimum:
              sys.exit(f'::error::Resolved Polychro version ({polychro_version}) is older than the minimum required for --schema support ({min_version}, see naftiko/polychro#20). Refusing to package the VSIX.')
          print(f'Polychro version {polychro_version} satisfies the minimum {min_version}.')
          "
      - name: Fetch Polychro native binaries
        # Source selection:
        #  - Default (release events / manual without run id): pull the binaries from a
        #    Polychro RELEASE. naftiko/polychro is public, so the automatic GITHUB_TOKEN is
        #    only needed to raise the API rate limit.
        #  - Manual with polychro_run_id: pull the binaries straight from an Actions RUN's
        #    artifacts (before any release exists). Downloading run artifacts ALWAYS requires
        #    a token with actions:read on naftiko/polychro, even though the repo is public — the
        #    workflow's own GITHUB_TOKEN cannot read another repo's artifacts.
        run: npm run fetch-binaries
        working-directory: extensions/naftiko-crafter
        env:
          GITHUB_TOKEN: ${{ github.event.inputs.polychro_run_id != '' && steps.app-token-polychro.outputs.token || github.token }}
          POLYCHRO_RUN_ID: ${{ github.event.inputs.polychro_run_id }}
          # Reuse the exact version the gate above validated (rather than re-resolving `latest`
          # independently), so a new Polychro release published between the two API calls can't
          # slip an unvalidated version past the gate. Only used when polychro_run_id is empty.
          POLYCHRO_VERSION: ${{ steps.resolve-polychro-version.outputs.version }}

      - name: Write Polychro version and date
        # Update infos.yaml in place (preserving any other fields) with the version/date
        # resolved by "Resolve Polychro version and date" above.
        working-directory: extensions/naftiko-crafter
        env:
          POLYCHRO_VERSION: ${{ steps.resolve-polychro-version.outputs.version }}
          CURRENT_DATE: ${{ steps.resolve-polychro-version.outputs.date }}
        run: |
          set -euo pipefail
          INFOS_FILE=src/resources/infos.yaml

          mkdir -p "$(dirname "${INFOS_FILE}")"
          touch "${INFOS_FILE}"
          POLYCHRO_VERSION="${POLYCHRO_VERSION}" CURRENT_DATE="${CURRENT_DATE}" \
            yq -i '.date = strenv(CURRENT_DATE) | .polychro.version = strenv(POLYCHRO_VERSION)' "${INFOS_FILE}"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        run: vsce package
        working-directory: extensions/naftiko-crafter

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: naftiko-crafter-vsix
          path: extensions/naftiko-crafter/*.vsix

      - name: Publish to GitHub Releases (fleet)
        if: github.event_name == 'release' || github.event.inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX=$(ls extensions/naftiko-crafter/*.vsix | head -1)
          TAG="${{ github.event.release.tag_name || github.event.inputs.version }}"
          gh release upload "$TAG" "$VSIX" --clobber --repo ${{ github.repository }}
